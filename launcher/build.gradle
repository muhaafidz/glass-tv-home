// Layout snapshots (docs/REVAMP.md §7) are opt-in: ./gradlew -Psnapshots :app:recordPaparazziDebug
// Without -Psnapshots nothing extra is resolved, so CI and the APK are unaffected.
buildscript {
    if (project.hasProperty('snapshots')) {
        repositories {
            google()
            mavenCentral()
            gradlePluginPortal()
        }
        dependencies {
            classpath 'app.cash.paparazzi:paparazzi-gradle-plugin:1.3.5'
            classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24'
        }
    }
}

plugins {
    id 'com.android.application' version '8.5.2' apply false
}
